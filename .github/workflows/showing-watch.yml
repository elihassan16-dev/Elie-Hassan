# Pings the app's new-showing watcher around the clock so a fresh booking on
# the ShowingTime calendar triggers a notification within a minute or two —
# even when nobody has the app open. GitHub often starts scheduled runs late,
# so each run keeps checking once a minute for ~9 minutes: consecutive runs
# overlap and cover the gaps. The endpoint throttles itself (45s), so
# overlapping pings are harmless.
# Off-peak minutes on purpose: GitHub delays scheduled runs badly when they
# collide with everyone else's :00/:05 crons (runs were landing hours apart).
name: Showing watcher
on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the BoldTrail lead sync
        run: curl -fsS -m 55 "https://gpflips.com/api/boldtrail/sync" || true
      - name: Ping the 24/7 email sweeper (auto-pins mail to properties)
        run: curl -fsS -m 55 "https://gpflips.com/api/email/sweep" || true
      - name: BoldTrail status (diagnostics in the log)
        run: curl -sS -m 30 "https://gpflips.com/api/boldtrail/status" || true
      - name: Jivetel webhook status (shape-only diagnostics in the log)
        run: curl -sS -m 30 "https://gpflips.com/api/jivetel/webhook" || true
      - name: Watch for new showings (once a minute for ~9 minutes)
        run: |
          for i in 1 2 3 4 5 6 7 8 9; do
            curl -fsS -m 30 "https://gpflips.com/api/showings/watch" || true
            echo ""
            [ "$i" -lt 9 ] && sleep 55 || true
          done
          # The test above is false on the last lap; without the "|| true" its
          # exit code (1) became the step's and every run emailed "failed".
