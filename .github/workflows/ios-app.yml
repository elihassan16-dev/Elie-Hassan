# 🍎 iPhone app (Capacitor) — builds on GitHub's Mac machines.
# Runs only when the app shell changes (website updates reach the app live) or
# by hand (Actions → iOS app → Run workflow).
# Without secrets it just checks the app compiles. With these secrets it signs
# the app and uploads it to TestFlight / App Store Connect:
#   APPLE_TEAM_ID       10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID          App Store Connect API key ID
#   ASC_ISSUER_ID       its Issuer ID
#   ASC_KEY_P8          the .p8 key file's text
name: iOS app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", "capacitor.config.json", "native/**", ".github/workflows/ios-app.yml", ".github/scripts/**"]
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_KEYS: ${{ secrets.ASC_KEY_P8 != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx cap sync ios
      - name: Check it compiles (no signing)
        if: ${{ env.HAS_KEYS != 'yes' }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Make sure the team has a device (Apple requires one to sign)
        if: ${{ env.HAS_KEYS == 'yes' }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node .github/scripts/asc-ensure-device.mjs
      - name: Archive + upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        if: ${{ env.HAS_KEYS == 'yes' }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"; printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive | tail -40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            $AUTH | tail -40
